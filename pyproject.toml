[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmr"
version = "0.4.0"
description = "Critical Materials Recovery decision-support prototype"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.38",
]

[tool.setuptools.packages.find]
where = ["src"]
